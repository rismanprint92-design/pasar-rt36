<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pasar RT 36 FINAL</title><script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css">
<style>.label-tersedia{background:rgba(16,185,129,0.9);font-size:9px;padding:2px 8px;border-radius:999px}.label-tidak{background:rgba(239,68,68,0.9);font-size:9px;padding:2px 8px;border-radius:999px}</style></head>
<body class="max-w-[480px] mx-auto bg-[#f5f7f6] min-h-screen pb-24">

<header class="bg-[#047857] text-white py-2.5 px-3 shadow-md flex items-center justify-between sticky top-0 z-40 gap-3">
<div class="flex-1 min-w-0"><h1 class="font-bold text-[14px] truncate">Pasar RT. 36 AR & Metroland</h1><p class="text-[10.5px] text-emerald-100 truncate">Beli dari tetangga, bantu ekonomi warga</p></div>
<div class="flex gap-2 flex-shrink-0"><button onclick="bukaModalJual()" class="bg-white text-[#ea580c] font-extrabold text-[12px] px-3.5 h-[38px] rounded-xl">+<br>Jual</button><button onclick="toggleModeAdmin()" class="bg-[#064e3b] text-white text-[12px] px-3 h-[38px] rounded-xl border">Admin</button></div>
</header>

<div class="bg-[#047857] pb-3 px-3"><div class="flex gap-2"><div class="flex-1 bg-white rounded-full px-3 py-2 flex items-center gap-2"><input id="input-pencarian" oninput="terapkanFilterDanPencarian()" placeholder="Cari..." class="flex-1 outline-none text-[13px]"></div><button onclick="bukaModalTokoSaya()" class="bg-white w-10 h-10 rounded-full">🏪</button></div></div>

<div id="daftar-kategori" class="flex gap-2 overflow-x-auto px-3 py-2.5 bg-white sticky top-[52px] z-30 border-b"></div>
<div id="daftar-produk" class="grid grid-cols-2 gap-2 p-2"></div>
<button id="btn-shopee" onclick="tambahTampil()" class="hidden mx-auto my-4 bg-white border px-5 py-2 rounded-full text-xs">Lihat Lainnya ↓</button>

<!-- MODAL WA PALING DEPAN Z-1150 -->
<div id="modal-opsi-beli" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-[1150] p-4"><div class="bg-white w-full max-w-xs p-5 rounded-2xl text-center space-y-3"><h3 class="font-bold">Hubungi Penjual</h3><p id="info-produk-beli" class="text-[11px] text-gray-500"></p><button id="btn-wa-otomatis" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold">Chat WA Otomatis</button><button id="btn-salin-nomor" class="w-full bg-gray-100 border py-3 rounded-xl font-bold">Salin Nomor HP</button><button onclick="tutupModalOpsiBeli()" class="w-full bg-gray-200 py-2.5 rounded-xl">Batal</button></div></div>

<!-- MODAL TOKO SAYA TENGAH + PIN+WA -->
<div id="modal-toko-saya" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-[1150] p-4"><div class="bg-white w-full max-w-sm rounded-2xl overflow-hidden"><div class="p-4 bg-gray-50 flex justify-between"><h3 class="font-bold text-[14px]">🏪 Toko Saya</h3><button onclick="tutupModalTokoSaya()">×</button></div><div class="p-5 space-y-3"><input id="input-pin-toko" placeholder="PIN Toko" class="w-full border-2 rounded-xl px-4 py-3"><input id="input-wa-toko" placeholder="No WA 628..." class="w-full border-2 rounded-xl px-4 py-3"><div class="flex gap-2"><button onclick="tutupModalTokoSaya()" class="flex-1 bg-gray-100 py-3 rounded-xl">Batal</button><button onclick="cariTokoSaya()" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl">Buka Toko</button></div><p id="status-toko-saya" class="text-[11px] text-center text-gray-400"></p><div id="daftar-produk-toko-saya" class="max-h-[40vh] overflow-y-auto space-y-2 hidden"></div></div></div></div>

<div id="modal-zoom" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center z-[1050] p-3"><div class="bg-white w-full max-w-sm rounded-2xl overflow-hidden"><div id="detail-foto" class="h-64 bg-gray-100"></div><div class="p-4"><h2 id="detail-nama" class="font-bold"></h2><p id="detail-harga" class="text-orange-500 font-extrabold"></p><p id="detail-penjual" class="text-[11px] text-gray-500 mt-1"></p><div class="flex gap-2 mt-4"><button onclick="tutupDetailProduk()" class="flex-1 bg-gray-100 py-3 rounded-xl">Tutup</button><button onclick="beliViaWA()" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl">Beli Via WA</button></div></div></div></div>

<div id="modal-jual" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-[1100] p-4"><div class="bg-white w-full max-w-sm rounded-2xl p-5"><h3 class="font-bold text-center mb-3">Jual Produk</h3><div class="space-y-2"><input id="jual-nama" placeholder="Nama produk" class="w-full border rounded-xl px-3 py-2.5"><input id="jual-harga" type="number" placeholder="Harga" class="w-full border rounded-xl px-3 py-2.5"><input id="jual-lokasi" placeholder="Blok" class="w-full border rounded-xl px-3 py-2.5"><input id="jual-wa" placeholder="No WA 628..." class="w-full border rounded-xl px-3 py-2.5"><input id="jual-pin" placeholder="PIN 4 digit" class="w-full border rounded-xl px-3 py-2.5"></div><div class="flex gap-2 mt-4"><button onclick="tutupModalJual()" class="flex-1 bg-gray-100 py-3 rounded-xl">Batal</button><button onclick="simpanProduk()" class="flex-1 bg-orange-500 text-white py-3 rounded-xl">Simpan</button></div></div></div>

<button id="btn-chat-live" class="fixed bottom-5 right-4 bg-[#22c55e] w-14 h-14 rounded-full shadow-xl text-white text-2xl z-[1000]">💬</button>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = { databaseURL: "https://pasar-rt-default-rtdb.firebaseio.com/" };
firebase.initializeApp(firebaseConfig);
const dbRef = firebase.database().ref('produk');
let produkData=[], produkFilteredGlobal=[], kategoriAktif='semua';
const BATAS_TAMPIL=12; let produkAktif=null;

function bersihkanTeks(t){ if(!t) return ''; return String(t).replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// === HITUNG UMUR PRODUK BOSKU 🕒 ===
function hitungUmurProduk(timestamp){
  if(!timestamp) return 'Baru';
  const s = Date.now() - timestamp;
  const menit = Math.floor(s/60000);
  const jam = Math.floor(s/3600000);
  const hari = Math.floor(s/86400000);
  if(menit < 1) return 'Baru saja';
  if(menit < 60) return `${menit} mnt lalu`;
  if(jam < 24) return `${jam} jam lalu`;
  if(hari == 1) return `Kemarin`;
  if(hari < 7) return `${hari} hr lalu`;
  if(hari < 30) return `${Math.floor(hari/7)} mgg lalu`;
  return `${Math.floor(hari/30)} bln lalu`;
}

const kategoriList=['semua','makanan','minuman','jasa','sayur','lainnya'];
function renderKategori(){
  const c=document.getElementById('daftar-kategori'); if(!c) return;
  c.innerHTML=''; kategoriList.forEach(k=>{
    c.innerHTML+=`<button onclick="setKategori('${k}')" id="kat-${k}" class="px-4 py-2 rounded-full text-xs border bg-white whitespace-nowrap">${k.toUpperCase()}</button>`;
  }); setKategori('semua');
}
function setKategori(k){
  kategoriAktif=k;
  document.querySelectorAll('#daftar-kategori button').forEach(b=>b.className='px-4 py-2 rounded-full text-xs border bg-white whitespace-nowrap');
  let a=document.getElementById('kat-'+k); if(a) a.className='px-4 py-2 rounded-full text-xs bg-[#047857] text-white whitespace-nowrap';
  terapkanFilterDanPencarian();
}

function renderProduk(data){
  const container=document.getElementById('daftar-produk'); if(!container) return; container.innerHTML='';
  if(!data||data.length===0){ container.innerHTML='<div class="col-span-2 text-center py-10 text-gray-400 text-xs">Belum ada barang.</div>'; return; }
  data.forEach(item=>{
    let def='https://via.placeholder.com/200?text=Produk+RT';
    let list=item.foto?(Array.isArray(item.foto)?item.foto:[item.foto]):[def];
    let foto=list[0]; let status=item.status||'tersedia';
    let isTersedia=status==='tersedia'; let label=isTersedia?'● Tersedia':'● Tidak';
    let cls=isTersedia?'label-tersedia':'label-tidak';
    let umur = hitungUmurProduk(item.timestamp);
    let badge=list.length>1?`<span class="absolute top-2 right-2 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded-full">${list.length} Foto</span>`:'';
    let card=`<div class="bg-white rounded-[20px] shadow-sm border overflow-hidden flex flex-col"><div class="relative cursor-pointer" onclick="bukaDetailProduk('${item.id}')"><img loading="lazy" src="${foto}" class="w-full h-36 object-cover bg-gray-100">${badge}<span class="absolute bottom-2 left-2 ${cls} text-white shadow">${label}</span><span class="absolute top-2 left-2 bg-black/55 text-white text-[8px] px-2 py-0.5 rounded-full">🕒 ${umur}</span></div><div class="p-2.5 cursor-pointer" onclick="bukaDetailProduk('${item.id}')"><h3 class="font-bold text-[13px] truncate">${bersihkanTeks(item.nama)}</h3><p class="text-orange-500 font-extrabold text-[14px]">Rp ${parseInt(item.harga||0).toLocaleString('id-ID')}</p><p class="text-[9px] text-gray-400 truncate">📍 ${bersihkanTeks(item.lokasi||'')} • ${umur}</p></div></div>`;
    container.innerHTML+=card;
  });
}

function terapkanFilterDanPencarian(){
  const kw=document.getElementById('input-pencarian')?.value.toLowerCase().trim()||'';
  let hasil=produkData;
  if(kategoriAktif!=='semua') hasil=hasil.filter(p=>p.kategori===kategoriAktif);
  if(kw!=='') hasil=hasil.filter(p=>(p.nama&&p.nama.toLowerCase().includes(kw))||(p.lokasi&&p.lokasi.toLowerCase().includes(kw)));
  produkFilteredGlobal=hasil;
  renderProduk(hasil.slice(0,BATAS_TAMPIL));
  const btn=document.getElementById('btn-shopee');
  if(btn){ if(produkFilteredGlobal.length>BATAS_TAMPIL) btn.style.display='block'; else btn.style.display='none'; }
}
function tambahTampil(){ renderProduk(produkFilteredGlobal); document.getElementById('btn-shopee').style.display='none'; }

function bukaDetailProduk(id){
  let item=produkData.find(p=>p.id===id); if(!item) return;
  document.getElementById('detail-nama').innerText=item.nama;
  document.getElementById('detail-harga').innerText='Rp '+parseInt(item.harga||0).toLocaleString('id-ID');
  let umurDetail=hitungUmurProduk(item.timestamp);
  document.getElementById('detail-penjual').innerText='👤 '+(item.lokasi||'')+' • 🕒 '+umurDetail;
  document.getElementById('detail-foto').innerHTML=`<img src="${item.foto?item.foto[0]:''}" class="w-full h-full object-cover">`;
  produkAktif=item; document.getElementById('modal-zoom').classList.remove('hidden');
}
function tutupDetailProduk(){ document.getElementById('modal-zoom').classList.add('hidden'); }

function beliViaWA(){
  let item=produkAktif; if(!item) return;
  document.getElementById('info-produk-beli').innerText=item.nama+' - Rp '+parseInt(item.harga).toLocaleString('id-ID');
  document.getElementById('modal-opsi-beli').classList.remove('hidden');
  let wa=(item.wa||'').replace(/\D/g,''); if(wa.startsWith('0')) wa='62'+wa.slice(1);
  document.getElementById('btn-wa-otomatis').onclick=()=>{
    let pesan=`Halo bosku, saya mau beli ${item.nama} Rp ${item.harga}`;
    window.open(`https://wa.me/${wa}?text=${encodeURIComponent(pesan)}`,'_blank');
  };
  document.getElementById('btn-salin-nomor').onclick=()=>{ navigator.clipboard.writeText(wa); alert('Nomor disalin: '+wa); };
}
function tutupModalOpsiBeli(){ document.getElementById('modal-opsi-beli').classList.add('hidden'); }
function bukaModalJual(){ document.getElementById('modal-jual').classList.remove('hidden'); }
function tutupModalJual(){ document.getElementById('modal-jual').classList.add('hidden'); }
function simpanProduk(){
  let nama=document.getElementById('jual-nama').value, harga=document.getElementById('jual-harga').value, lokasi=document.getElementById('jual-lokasi').value, wa=document.getElementById('jual-wa').value, pin=document.getElementById('jual-pin').value;
  if(!nama||!harga||!wa||!pin) return alert('Lengkapi bosku!');
  let id='prod_'+Date.now(); let waB=''+wa.replace(/\D/g,''); if(waB.startsWith('0')) waB='62'+waB.slice(1);
  dbRef.child(id).set({id,nama,harga,lokasi,wa:waB,pin,timestamp:Date.now(),status:'tersedia',foto:['https://via.placeholder.com/200']});
  alert('Berhasil!'); tutupModalJual();
}
function bukaModalTokoSaya(){ document.getElementById('modal-toko-saya').classList.remove('hidden'); }
function tutupModalTokoSaya(){ document.getElementById('modal-toko-saya').classList.add('hidden'); }
function cariTokoSaya(){
  let pin=document.getElementById('input-pin-toko').value.trim();
  let waI=document.getElementById('input-wa-toko').value.trim().replace(/\D/g,''); if(waI.startsWith('0')) waI='62'+waI.slice(1);
  let statusEl=document.getElementById('status-toko-saya');
  if(!pin||!waI){ statusEl.innerText='Isi PIN dan WA dulu!'; return; }
  let hasil=produkData.filter(p=>{
    let w=(p.wa||'').replace(/\D/g,''); if(w.startsWith('0')) w='62'+w.slice(1);
    return (p.pin||'').trim()===pin && w===waI;
  });
  if(hasil.length===0){ statusEl.innerText='❌ PIN/WA salah bosku!'; return; }
  statusEl.innerText=`✅ Ketemu ${hasil.length} produk`;
  let listEl=document.getElementById('daftar-produk-toko-saya'); listEl.innerHTML='';
  hasil.forEach(item=>{
    let umur=hitungUmurProduk(item.timestamp);
    listEl.innerHTML+=`<div class="flex justify-between items-center border rounded-xl p-2 text-xs"><div><b>${bersihkanTeks(item.nama)}</b><br><span class="text-[10px] text-gray-400">🕒 ${umur}</span></div><button onclick="dbRef.child('${item.id}').remove()" class="bg-red-500 text-white px-3 py-1 rounded-lg">Hapus</button></div>`;
  }); listEl.classList.remove('hidden');
}
function toggleModeAdmin(){ alert('Mode Admin: Coming soon bosku!'); }
dbRef.on('value', snap=>{
  let val=snap.val(); produkData=val?Object.values(val):[]; produkData.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
  terapkanFilterDanPencarian();
});
document.addEventListener('DOMContentLoaded', ()=>{
  renderKategori();
  const bubble=document.getElementById('btn-chat-live'); if(!bubble) return;
  let isDragging=false, sx, sy, iL, iT;
  bubble.style.touchAction='none'; bubble.style.cursor='grab';
  let saved=JSON.parse(localStorage.getItem('posisiChatBubble')||'null');
  if(saved){ bubble.style.left=saved.left; bubble.style.top=saved.top; bubble.style.right='auto'; bubble.style.bottom='auto'; }
  function onStart(e){ isDragging=true; bubble.style.cursor='grabbing'; let p=e.touches?e.touches[0]:e; sx=p.clientX; sy=p.clientY; let r=bubble.getBoundingClientRect(); iL=r.left; iT=r.top; e.preventDefault(); }
  function onMove(e){ if(!isDragging) return; let p=e.touches?e.touches[0]:e; let nl=iL+(p.clientX-sx), nt=iT+(p.clientY-sy); nl=Math.max(5,Math.min(window.innerWidth-bubble.offsetWidth-5,nl)); nt=Math.max(5,Math.min(window.innerHeight-bubble.offsetHeight-5,nt)); bubble.style.left=nl+'px'; bubble.style.top=nt+'px'; bubble.style.right='auto'; bubble.style.bottom='auto'; }
  function onEnd(){ if(!isDragging) return; isDragging=false; bubble.style.cursor='grab'; localStorage.setItem('posisiChatBubble',JSON.stringify({left:bubble.style.left,top:bubble.style.top})); }
  bubble.addEventListener('mousedown',onStart); bubble.addEventListener('touchstart',onStart,{passive:false});
  window.addEventListener('mousemove',onMove); window.addEventListener('touchmove',onMove,{passive:false});
  window.addEventListener('mouseup',onEnd); window.addEventListener('touchend',onEnd);
});
</script>
</body>
</html>
