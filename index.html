<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace RT. 36 AR Regency</title>

  <!-- PWA - INI YANG BIKIN ICON KEREN BOS -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#059669">
  <link rel="icon" type="image/png" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-512.png">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- Firebase SDK v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-gray-100 pb-20 font-sans">

  <!-- Header Utama -->
  <header class="bg-emerald-600 text-white p-4 sticky top-0 z-40 shadow-md">
    <div class="flex justify-between items-center max-w-md mx-auto">
      <div>
        <h1 class="font-bold text-lg">Pasar RT. 36 Anduonohu Regency</h1>
        <p class="text-xs text-emerald-100">Beli dari tetangga, bantu ekonomi warga</p>
      </div>
      <div class="flex gap-2">
        <button onclick="bukaModalJual()" class="bg-white text-emerald-600 text-xs font-bold px-3 py-2 rounded-lg shadow hover:bg-emerald-50">
          + Jual
        </button>
        <button onclick="toggleModeAdmin()" id="btn-admin" class="bg-emerald-800 text-white text-xs font-bold px-3 py-2 rounded-lg border border-emerald-500 hover:bg-emerald-900 flex items-center gap-1">
          <i class="ph ph-shield-check text-sm"></i> <span id="label-admin">Admin</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Banner Pengumuman Admin -->
  <div id="banner-admin" class="hidden bg-amber-500 text-white text-xs p-2.5 sticky top-[60px] z-30 shadow-inner flex justify-between items-center px-4 max-w-md mx-auto font-medium">
    <span>⚠️ Mode Admin Aktif</span>
    <div class="flex gap-2 items-center">
      <button onclick="bukaModalGantiPin()" class="bg-amber-600 px-2 py-1 rounded text-[11px] hover:bg-amber-700">Ubah PIN</button>
      <button onclick="keluarAdmin()" class="underline text-[11px]">Keluar</button>
    </div>
  </div>

  <!-- Filter Kategori -->
  <main class="max-w-md mx-auto p-4">
    <div class="flex gap-2 overflow-x-auto pb-3 text-xs font-medium no-scrollbar">
      <button onclick="filterKategori('semua')" class="px-4 py-2 bg-emerald-600 text-white rounded-full whitespace-nowrap shadow-sm">Semua</button>
      <button onclick="filterKategori('kuliner')" class="px-4 py-2 bg-white text-gray-700 rounded-full border whitespace-nowrap">Kuliner</button>
      <button onclick="filterKategori('sembako')" class="px-4 py-2 bg-white text-gray-700 rounded-full border whitespace-nowrap">Sembako</button>
      <button onclick="filterKategori('jasa')" class="px-4 py-2 bg-white text-gray-700 rounded-full border whitespace-nowrap">Jasa</button>
      <button onclick="filterKategori('bekas')" class="px-4 py-2 bg-white text-gray-700 rounded-full border whitespace-nowrap">Barang Bekas</button>
    </div>

    <!-- Grid Produk -->
    <div id="daftar-produk" class="grid grid-cols-2 gap-3 mt-2">
      <!-- Card Produk dimuat secara realtime dari Firebase -->
    </div>
  </main>

  <!-- Modal Login Admin -->
  <div id="modal-login-admin" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white w-full max-w-xs p-5 rounded-2xl text-xs">
      <h3 class="font-bold text-gray-800 text-sm mb-2 text-center">Masuk Mode Admin RT</h3>
      <p class="text-gray-500 mb-4 text-center">Masukkan PIN pengurus RT terpusat.</p>
      <input type="password" id="pin-admin" class="w-full border p-2.5 rounded-lg text-center font-bold text-base tracking-widest mb-3 focus:outline-emerald-500" placeholder="••••">
      <div class="flex gap-2">
        <button onclick="tutupModalAdmin()" class="w-1/2 bg-gray-200 text-gray-700 py-2.5 rounded-lg font-bold">Batal</button>
        <button onclick="verifikasiAdmin()" class="w-1/2 bg-emerald-600 text-white py-2.5 rounded-lg font-bold">Masuk</button>
      </div>
    </div>
  </div>

  <!-- Modal Ubah PIN Admin -->
  <div id="modal-ganti-pin" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white w-full max-w-xs p-5 rounded-2xl text-xs space-y-3">
      <h3 class="font-bold text-gray-800 text-sm text-center">Ubah PIN Admin</h3>
      <div>
        <label class="block font-medium mb-1">PIN Lama</label>
        <input type="password" id="pin-lama" class="w-full border p-2 rounded-lg text-center font-bold tracking-widest" placeholder="••••">
      </div>
      <div>
        <label class="block font-medium mb-1">PIN Baru</label>
        <input type="password" id="pin-baru" class="w-full border p-2 rounded-lg text-center font-bold tracking-widest" placeholder="••••">
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="tutupModalGantiPin()" class="w-1/2 bg-gray-200 text-gray-700 py-2 rounded-lg font-bold">Batal</button>
        <button onclick="simpanPinBaru()" class="w-1/2 bg-amber-600 text-white py-2 rounded-lg font-bold hover:bg-amber-700">Simpan</button>
      </div>
    </div>
  </div>

  <!-- Modal Form Tambah Produk -->
  <div id="modal-jual" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-end sm:items-center justify-center z-50">
    <div class="bg-white w-full max-w-md p-5 rounded-t-2xl sm:rounded-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-gray-800">Pasang Dagangan Baru</h3>
        <button onclick="tutupModalJual()" class="text-gray-400 text-xl">&times;</button>
      </div>

      <form id="form-tambah" onsubmit="tambahProduk(event)" class="space-y-3 text-xs">
        <div>
          <label class="block font-medium mb-1">Nama Produk / Jasa</label>
          <input type="text" id="nama" required class="w-full border p-2.5 rounded-lg focus:outline-emerald-500" placeholder="Contoh: Nasi Uduk Komplit">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-medium mb-1">Harga (Rp)</label>
            <input type="number" id="harga" required class="w-full border p-2.5 rounded-lg focus:outline-emerald-500" placeholder="10000">
          </div>
          <div>
            <label class="block font-medium mb-1">Kategori</label>
            <select id="kategori" class="w-full border p-2.5 rounded-lg focus:outline-emerald-500">
              <option value="kuliner">Kuliner</option>
              <option value="sembako">Sembako</option>
              <option value="jasa">Jasa</option>
              <option value="bekas">Barang Bekas</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-medium mb-1">Nama Penjual</label>
            <input type="text" id="penjual" required class="w-full border p-2.5 rounded-lg focus:outline-emerald-500" placeholder="Bu RT / Pak Ahmad">
          </div>
          <div>
            <label class="block font-medium mb-1">Blok / No. Rumah</label>
            <input type="text" id="lokasi" required class="w-full border p-2.5 rounded-lg focus:outline-emerald-500" placeholder="Blok A1 No. 4">
          </div>
        </div>
        <div>
          <label class="block font-medium mb-1">No. WhatsApp (Awali 62, contoh: 628...)</label>
          <input type="number" id="whatsapp" required class="w-full border p-2.5 rounded-lg focus:outline-emerald-500" placeholder="628123456789">
        </div>
        <div>
          <label class="block font-medium mb-1">Catatan / Keterangan (Opsional)</label>
          <textarea id="catatan" rows="2" class="w-full border p-2.5 rounded-lg focus:outline-emerald-500" placeholder="Contoh: Bisa diantar jika beli min. 2 porsi. COD di pos satpam."></textarea>
        </div>
        <div>
          <label class="block font-medium mb-1">Foto Produk (Bisa pilih lebih dari 1 foto)</label>
          <input type="file" id="input-file-foto" accept="image/*" multiple class="w-full border p-2 rounded-lg bg-gray-50 text-[11px] file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
          <p class="text-[10px] text-gray-400 mt-1">*Tekan Ctrl (di PC) atau tahan (di HP) untuk memilih beberapa foto sekaligus.</p>
        </div>

        <button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold mt-2 hover:bg-emerald-700">
          Tayangkan Dagangan
        </button>
      </form>
    </div>
  </div>

  <!-- Modal Zoom / Perbesar Foto (Lightbox) -->
  <div id="modal-zoom" class="fixed inset-0 bg-black bg-opacity-90 hidden flex flex-col items-center justify-center z-50 p-2">
    <button onclick="tutupModalZoom()" class="absolute top-4 right-4 text-white text-3xl font-bold bg-black bg-opacity-50 px-3 py-1 rounded-full hover:bg-opacity-80">&times;</button>
    <div class="relative max-w-full max-h-[80vh] flex items-center justify-center overflow-auto">
      <img id="img-zoom-target" src="" class="max-w-full max-h-[75vh] object-contain rounded-lg transition-transform duration-200" alt="Zoom Foto">
    </div>
    <!-- Kontrol Zoom & Navigasi Thumbnail -->
    <div class="mt-4 flex flex-col items-center gap-2">
      <div class="flex gap-3 bg-white bg-opacity-20 backdrop-blur px-4 py-2 rounded-full">
        <button onclick="ubahSkalaZoom(0.2)" class="text-white text-sm font-bold bg-black bg-opacity-40 px-3 py-1 rounded hover:bg-opacity-60">🔍 Perbesar (+)</button>
        <button onclick="ubahSkalaZoom(-0.2)" class="text-white text-sm font-bold bg-black bg-opacity-40 px-3 py-1 rounded hover:bg-opacity-60">🔍 Perkecil (-)</button>
        <button onclick="resetZoom()" class="text-white text-sm font-bold bg-black bg-opacity-40 px-3 py-1 rounded hover:bg-opacity-60">🔄 Reset</button>
      </div>
      <div id="zoom-thumbnails" class="flex gap-2 overflow-x-auto max-w-xs p-1">
        <!-- Thumbnail kecil di bawah modal zoom -->
      </div>
    </div>
  </div>

  <!-- Script Firebase & Logika Aplikasi -->
  <script>
    // Konfigurasi Firebase Anda
    const firebaseConfig = {
      apiKey: "AIzaSyAJTAM4MdsOzcy2i3NOJySDTZ5XV384VvY",
      authDomain: "pasar-rt36.firebaseapp.com",
      databaseURL: "https://pasar-rt36-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "pasar-rt36",
      storageBucket: "pasar-rt36.firebasestorage.app",
      messagingSenderId: "217440554731",
      appId: "1:217440554731:web:876717f8204cf40deeb8ae",
      measurementId: "G-G5HXM56NWX"
    };

    // Inisialisasi Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const dbRef = database.ref('produk_pasar');
    const pinRef = database.ref('pengaturan/admin_pin');

    let isAdmin = false;
    let pinAdminAktif = "1234";
    let produkData = [];
    let currentZoomScale = 1;
    let activeZoomPhotos = [];

    // Sinkronisasi PIN Admin secara realtime dari Firebase
    pinRef.on('value', (snapshot) => {
      const pinDb = snapshot.val();
      if (pinDb) {
        pinAdminAktif = pinDb;
      } else {
        pinRef.set("1234");
      }
    });

    // Mengambil data produk secara realtime dari Firebase
    dbRef.on('value', (snapshot) => {
      const data = snapshot.val();
      produkData = [];
      if (data) {
        Object.keys(data).forEach(key => {
          produkData.unshift({ id: key, ...data[key] });
        });
      }
      renderProduk(produkData);
    });

    function renderProduk(data) {
      const container = document.getElementById('daftar-produk');
      container.innerHTML = '';

      if(!data || data.length === 0) {
        container.innerHTML = `<div class="col-span-2 text-center py-10 text-gray-400 text-xs">Belum ada barang di kategori ini.</div>`;
        return;
      }

      data.forEach(item => {
        const defaultFoto = 'https://via.placeholder.com/200?text=Produk+RT';
        // Handle kompatibilitas foto lama (berupa string tunggal) atau baru (berupa array foto)
        let listFoto = [defaultFoto];
        if (item.foto) {
          if (Array.isArray(item.foto)) {
            listFoto = item.foto;
          } else {
            listFoto = [item.foto];
          }
        }

        const fotoUtama = listFoto[0];
        const catatanHtml = item.catatan ? `<p class="text-[10px] text-gray-400 italic mt-1 line-clamp-2">📝 "${item.catatan}"</p>` : '';
        
        // Buat badge jumlah foto jika lebih dari 1
        const badgeFoto = listFoto.length > 1 ? `
          <span class="absolute top-2 right-2 bg-black bg-opacity-60 text-white text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1">
            <i class="ph ph-images"></i> ${listFoto.length} Foto
          </span>
        ` : '';

        // Render thumbnail kecil di dalam card jika ada lebih dari 1 foto
        let miniThumbnails = '';
        if (listFoto.length > 1) {
          miniThumbnails = `<div class="flex gap-1 mt-2 overflow-x-auto pb-1">`;
          listFoto.forEach((f, idx) => {
            miniThumbnails += `<img src="${f}" onclick='bukaModalZoom(${JSON.stringify(listFoto)}, ${idx})' class="w-10 h-10 object-cover rounded border hover:border-emerald-500 cursor-pointer flex-shrink-0" alt="thumb">`;
          });
          miniThumbnails += `</div>`;
        }

        const tombolAdminHapus = isAdmin ? `
          <button onclick="hapusProduk('${item.id}')" class="w-full mt-2 bg-red-100 text-red-600 text-xs font-bold py-1.5 rounded-lg border border-red-200 hover:bg-red-200 flex items-center justify-center gap-1">
            <i class="ph ph-trash"></i> Hapus (Admin)
          </button>
        ` : '';

        const card = `
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between">
            <div class="relative cursor-pointer" onclick='bukaModalZoom(${JSON.stringify(listFoto)}, 0)'>
              <img src="${fotoUtama}" class="w-full h-32 object-cover hover:opacity-95 transition" alt="${item.nama}">
              ${badgeFoto}
            </div>
            <div class="p-3 flex-1 flex flex-col justify-between">
              <div>
                <span class="text-[10px] bg-emerald-50 text-emerald-600 font-semibold px-2 py-0.5 rounded uppercase">${item.kategori}</span>
                <h3 class="font-bold text-gray-800 text-sm mt-1 line-clamp-1">${item.nama}</h3>
                <p class="text-emerald-600 font-bold text-sm">Rp ${parseInt(item.harga).toLocaleString('id-ID')}</p>
                <p class="text-[11px] text-gray-500 mt-1">👤 ${item.penjual} (${item.lokasi})</p>
                ${catatanHtml}
                ${miniThumbnails}
              </div>
              <div class="mt-2">
                <button onclick='pesanWhatsApp("${item.wa}", "${item.nama}", ${item.harga}, ${JSON.stringify(item.catatan || "-")})' 
                  class="w-full bg-emerald-600 text-white text-xs font-medium py-2 rounded-lg flex items-center justify-center gap-1 hover:bg-emerald-700">
                  <i class="ph ph-whatsapp-logo text-base"></i> Beli Via WA
                </button>
                ${tombolAdminHapus}
              </div>
            </div>
          </div>
        `;
        container.innerHTML += card;
      });
    }

    // --- FITUR ZOOM / PERBESAR GAMBAR ---
    function bukaModalZoom(arrayFoto, indexAktif) {
      activeZoomPhotos = arrayFoto;
      currentZoomScale = 1;
      const modal = document.getElementById('modal-zoom');
      const imgTarget = document.getElementById('img-zoom-target');
      const thumbContainer = document.getElementById('zoom-thumbnails');

      imgTarget.src = arrayFoto[indexAktif];
      imgTarget.style.transform = `scale(${currentZoomScale})`;

      // Render thumbnail di modal zoom
      thumbContainer.innerHTML = '';
      if (arrayFoto.length > 1) {
        arrayFoto.forEach((f, idx) => {
          thumbContainer.innerHTML += `
            <img src="${f}" onclick="pilihFotoZoom(${idx})" class="w-12 h-12 object-cover rounded border-2 ${idx === indexAktif ? 'border-emerald-500' : 'border-transparent opacity-70'} cursor-pointer hover:opacity-100">
          `;
        });
      }

      modal.classList.remove('hidden');
    }

    function pilihFotoZoom(index) {
      const imgTarget = document.getElementById('img-zoom-target');
      imgTarget.src = activeZoomPhotos[index];
      currentZoomScale = 1;
      imgTarget.style.transform = `scale(${currentZoomScale})`;

      // Update border aktif thumbnail
      const thumbs = document.getElementById('zoom-thumbnails').children;
      for(let i=0; i<thumbs.length; i++) {
        if(i === index) {
          thumbs[i].classList.remove('border-transparent', 'opacity-70');
          thumbs[i].classList.add('border-emerald-500', 'opacity-100');
        } else {
          thumbs[i].classList.add('border-transparent', 'opacity-70');
          thumbs[i].classList.remove('border-emerald-500', 'opacity-100');
        }
      }
    }

    function ubahSkalaZoom(delta) {
      currentZoomScale += delta;
      if (currentZoomScale < 1) currentZoomScale = 1;
      if (currentZoomScale > 3) currentZoomScale = 3; // Maksimal zoom 3x
      const imgTarget = document.getElementById('img-zoom-target');
      imgTarget.style.transform = `scale(${currentZoomScale})`;
    }

    function resetZoom() {
      currentZoomScale = 1;
      const imgTarget = document.getElementById('img-zoom-target');
      imgTarget.style.transform = `scale(${currentZoomScale})`;
    }

    function tutupModalZoom() {
      document.getElementById('modal-zoom').classList.add('hidden');
    }

    function pesanWhatsApp(nomorWA, namaBarang, harga, catatanPenjual) {
      const pesan = `Halo, saya tetangga perumahan RT. 36 AR Regency. Saya mau pesan via Aplikasi Pasar RT:\n\n* *Produk:* ${namaBarang}\n* *Harga:* Rp ${parseInt(harga).toLocaleString('id-ID')}\n* *Catatan Penjual:* ${catatanPenjual}\n\nApakah stok/jasanya masih tersedia? Terima kasih!`;
      const url = `https://wa.me/${nomorWA}?text=${encodeURIComponent(pesan)}`;
      window.open(url, '_blank');
    }

    function filterKategori(kat) {
      if (kat === 'semua') {
        renderProduk(produkData);
      } else {
        const filtered = produkData.filter(p => p.kategori === kat);
        renderProduk(filtered);
      }
    }

    // --- LOGIK ADMIN & PIN TERPUSAT ---
    function toggleModeAdmin() {
      if (isAdmin) { keluarAdmin(); } 
      else { document.getElementById('modal-login-admin').classList.remove('hidden'); }
    }
    function tutupModalAdmin() {
      document.getElementById('modal-login-admin').classList.add('hidden');
      document.getElementById('pin-admin').value = '';
    }
    function verifikasiAdmin() {
      const inputPin = document.getElementById('pin-admin').value;
      if (inputPin === pinAdminAktif) {
        isAdmin = true;
        document.getElementById('banner-admin').classList.remove('hidden');
        document.getElementById('label-admin').innerText = 'Pengurus (Aktif)';
        tutupModalAdmin();
        renderProduk(produkData);
      } else { alert('PIN Admin Salah!'); }
    }
    function keluarAdmin() {
      isAdmin = false;
      document.getElementById('banner-admin').classList.add('hidden');
      document.getElementById('label-admin').innerText = 'Admin';
      renderProduk(produkData);
    }
    function bukaModalGantiPin() { document.getElementById('modal-ganti-pin').classList.remove('hidden'); }
    function tutupModalGantiPin() { document.getElementById('modal-ganti-pin').classList.add('hidden'); }
    
    function simpanPinBaru() {
      const pinLama = document.getElementById('pin-lama').value;
      const pinBaru = document.getElementById('pin-baru').value;
      
      if (pinLama !== pinAdminAktif) { alert('PIN Lama salah!'); return; }
      if (!pinBaru || pinBaru.length < 3) { alert('PIN Baru minimal 3 karakter.'); return; }

      pinRef.set(pinBaru).then(() => {
        alert('PIN Admin berhasil diubah untuk seluruh sistem!');
        pinAdminAktif = pinBaru;
        tutupModalGantiPin();
        document.getElementById('pin-lama').value = '';
        document.getElementById('pin-baru').value = '';
      }).catch((err) => {
        alert('Gagal mengubah PIN: ' + err.message);
      });
    }

    // --- FORM TAMBAH PRODUK DENGAN MULTI-FOTO ---
    function bukaModalJual() { document.getElementById('modal-jual').classList.remove('hidden'); }
    function tutupModalJual() { document.getElementById('modal-jual').classList.add('hidden'); }

    function tambahProduk(e) {
      e.preventDefault();
      const fileInput = document.getElementById('input-file-foto');
      
      if (fileInput.files && fileInput.files.length > 0) {
        let base64Photos = [];
        let filesProcessed = 0;

        // Loop untuk membaca semua file foto yang dipilih penjual
        Array.from(fileInput.files).forEach((file, index) => {
          const reader = new FileReader();
          reader.onload = function(event) {
            base64Photos[index] = event.target.result;
            filesProcessed++;

            // Jika semua file sudah selesai dibaca, simpan ke Firebase
            if (filesProcessed === fileInput.files.length) {
              simpanKeFirebase(base64Photos);
            }
          };
          reader.readAsDataURL(file);
        });
      } else {
        simpanKeFirebase(['https://via.placeholder.com/200?text=Produk+RT']);
      }
    }

    function simpanKeFirebase(arrayFotoUrl) {
      const barangBaru = {
        nama: document.getElementById('nama').value,
        harga: parseInt(document.getElementById('harga').value),
        kategori: document.getElementById('kategori').value,
        penjual: document.getElementById('penjual').value,
        lokasi: document.getElementById('lokasi').value,
        wa: document.getElementById('whatsapp').value,
        catatan: document.getElementById('catatan').value,
        foto: arrayFotoUrl, // Menyimpan array foto
        timestamp: Date.now()
      };
      
      dbRef.push(barangBaru).then(() => {
        tutupModalJual();
        document.getElementById('form-tambah').reset();
        
        if(confirm("Dagangan berhasil ditayangkan secara online!\n\nBagikan pengumuman produk ini ke Grup WhatsApp Warga RT?")) {
          kirimNotifikasiWA(barangBaru);
        }
      }).catch(err => {
        alert("Gagal menyimpan data: " + err.message);
      });
    }

    function hapusProduk(id) {
      if (confirm('Hapus postingan ini? Data akan terhapus untuk seluruh warga.')) {
        dbRef.child(id).remove();
      }
    }

    function kirimNotifikasiWA(item) {
      const teksWA = `🛒 *DAGANGAN BARU DI PASAR RT. 36 AR REGENCY!*\n\n` +
                     `* *Produk:* ${item.nama}\n` +
                     `* *Harga:* Rp ${item.harga.toLocaleString('id-ID')}\n` +
                     `* *Penjual:* ${item.penjual} (${item.lokasi})\n` +
                     `* *Kategori:* ${item.kategori.toUpperCase()}\n\n` +
